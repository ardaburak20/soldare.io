<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soldare.io Room System Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #222; 
            color: white; 
        }
        .test-section { 
            margin: 20px 0; 
            padding: 15px; 
            border: 1px solid #444; 
            border-radius: 8px; 
            background: #333; 
        }
        button { 
            padding: 10px 15px; 
            margin: 5px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            background: #4caf50; 
            color: white; 
        }
        input { 
            padding: 10px; 
            margin: 5px; 
            border: 1px solid #666; 
            border-radius: 5px; 
            background: #444; 
            color: white; 
        }
        #log { 
            background: #111; 
            color: #0f0; 
            padding: 10px; 
            border-radius: 5px; 
            height: 200px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 12px; 
        }
    </style>
</head>
<body>
    <h1>🏠 Soldare.io Room System Test</h1>
    
    <div class="test-section">
        <h3>📋 Test Status</h3>
        <p>Server: <span id="serverStatus">Disconnected</span></p>
        <p>Room Code: <span id="currentRoom">None</span></p>
        <p>Player ID: <span id="playerId">None</span></p>
    </div>

    <div class="test-section">
        <h3>🎮 Actions</h3>
        <button onclick="testAutoJoin()">Auto Join (Normal Play)</button>
        <button onclick="testRoomJoin()">Join Specific Room</button>
        <button onclick="testInvalidRoom()">Test Invalid Room</button>
        <br>
        <input type="text" id="roomCodeTest" placeholder="Room Code (6 digits)" maxlength="6" value="123456">
        <input type="text" id="playerName" placeholder="Player Name" value="TestPlayer">
    </div>

    <div class="test-section">
        <h3>📜 Log</h3>
        <div id="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let playerId = null;
        let currentRoom = null;

        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus() {
            document.getElementById('serverStatus').textContent = socket?.connected ? 'Connected' : 'Disconnected';
            document.getElementById('currentRoom').textContent = currentRoom || 'None';
            document.getElementById('playerId').textContent = playerId || 'None';
        }

        function connect() {
            if (socket) return;
            
            socket = io('http://localhost:3001');
            
            socket.on('connect', () => {
                log('✅ Connected to server');
                updateStatus();
            });
            
            socket.on('disconnect', () => {
                log('❌ Disconnected from server');
                updateStatus();
            });
            
            socket.on('joined', (data) => {
                playerId = data.id;
                currentRoom = data.roomCode;
                log(`🎉 Successfully joined room ${data.roomCode} with ID ${data.id}`);
                updateStatus();
            });
            
            socket.on('roomNotFound', () => {
                log('❌ Room not found');
            });
            
            socket.on('roomFull', () => {
                log('❌ Room is full');
            });
            
            socket.on('serverFull', () => {
                log('❌ Server is full');
            });
        }

        function testAutoJoin() {
            if (!socket) {
                log('❌ Not connected to server');
                return;
            }
            
            const name = document.getElementById('playerName').value || 'TestPlayer';
            log(`🔄 Testing auto join with name: ${name}`);
            socket.emit('join', { name: name, color: '#ff0000' });
        }

        function testRoomJoin() {
            if (!socket) {
                log('❌ Not connected to server');
                return;
            }
            
            const roomCode = document.getElementById('roomCodeTest').value;
            const name = document.getElementById('playerName').value || 'TestPlayer';
            
            if (!/^\d{6}$/.test(roomCode)) {
                log('❌ Invalid room code format (must be 6 digits)');
                return;
            }
            
            log(`🔄 Testing room join: ${roomCode} with name: ${name}`);
            socket.emit('joinRoom', { roomCode: roomCode, name: name, color: '#00ff00' });
        }

        function testInvalidRoom() {
            if (!socket) {
                log('❌ Not connected to server');
                return;
            }
            
            log('🔄 Testing invalid room code: 999999');
            socket.emit('joinRoom', { roomCode: '999999', name: 'TestPlayer', color: '#0000ff' });
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-connect on page load
        window.onload = () => {
            log('🚀 Starting room system test...');
            connect();
        };
    </script>
</body>
</html>
